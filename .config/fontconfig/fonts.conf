<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- =================================================================== -->
  <!-- 1. ALIAS PROXIES: Map popular web/Windows fonts to default families -->
  <!-- =================================================================== -->
  <alias>
    <family>Arial</family>
    <prefer><family>sans-serif</family></prefer>
  </alias>
  <alias>
    <family>Helvetica</family>
    <prefer><family>sans-serif</family></prefer>
  </alias>
  <alias>
    <family>Tahoma</family>
    <prefer><family>sans-serif</family></prefer>
  </alias>
  <alias>
    <family>Segoe UI</family>
    <prefer><family>sans-serif</family></prefer>
  </alias>
  <alias>
    <family>Times New Roman</family>
    <prefer><family>serif</family></prefer>
  </alias>
  <alias>
    <family>Courier New</family>
    <prefer><family>monospace</family></prefer>
  </alias>

  <!-- =================================================================== -->
  <!-- 2. SANS-SERIF: Primary universal fallback chain                     -->
  <!-- =================================================================== -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <!-- Latin / Greek / Cyrillic -->
      <family>Noto Sans</family>
      <!-- Arabic / Persian / Urdu -->
      <family>Noto Sans Arabic UI</family>
      <family>Noto Sans Arabic</family>
      <!-- Hebrew -->
      <family>Noto Sans Hebrew</family>
      <!-- CJK (East Asia) -->
      <family>Noto Sans CJK SC</family> <!-- Simplified Chinese -->
      <family>Noto Sans CJK TC</family> <!-- Traditional Chinese -->
      <family>Noto Sans CJK JP</family> <!-- Japanese -->
      <family>Noto Sans CJK KR</family> <!-- Korean -->
      <!-- South Asia (Indic) -->
      <family>Noto Sans Devanagari</family> <!-- Hindi, Marathi, Nepali -->
      <family>Noto Sans Bengali</family>
      <family>Noto Sans Tamil</family>
      <family>Noto Sans Telugu</family>
      <family>Noto Sans Gujarati</family>
      <family>Noto Sans Kannada</family>
      <family>Noto Sans Malayalam</family>
      <family>Noto Sans Gurmukhi</family> <!-- Punjabi -->
      <family>Noto Sans Sinhala</family>
      <!-- Southeast Asia -->
      <family>Noto Sans Thai</family>
      <family>Noto Sans Khmer</family>
      <family>Noto Sans Lao</family>
      <family>Noto Sans Myanmar</family>
      <!-- African / Other -->
      <family>Noto Sans Ethiopic</family> <!-- Amharic -->
      <family>Noto Sans Georgian</family>
      <family>Noto Sans Armenian</family>
      <!-- Emoji & Universal Symbols -->
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- =================================================================== -->
  <!-- 3. SERIF: Universal serif fallback chain                           -->
  <!-- =================================================================== -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Serif Hebrew</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif CJK TC</family>
      <family>Noto Serif CJK JP</family>
      <family>Noto Serif CJK KR</family>
      <family>Noto Serif Devanagari</family>
      <family>Noto Serif Bengali</family>
      <family>Noto Serif Thai</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- =================================================================== -->
  <!-- 4. MONOSPACE: Universal coding/terminal fallback chain              -->
  <!-- =================================================================== -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Arabic UI</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- =================================================================== -->
  <!-- 5. RENDERING OPTIMIZATIONS                                          -->
  <!-- Dynamic reshaping, subpixel antialiasing, and LCD filtering        -->
  <!-- =================================================================== -->
  <match target="font">
    <edit mode="assign" name="antialias"><bool>true</bool></edit>
    <edit mode="assign" name="hinting"><bool>true</bool></edit>
    <edit mode="assign" name="hintstyle"><const>hintslight</const></edit>
    <edit mode="assign" name="rgba"><const>rgb</const></edit>
    <edit mode="assign" name="lcdfilter"><const>lcddefault</const></edit>
  </match>

</fontconfig>
