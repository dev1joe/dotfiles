animations {
    enabled = true

    # Using simplified, faster curves
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15

    # Reduced durations (from 3 down to 2 or 1.5)
    animation = windows, 1, 2, md3_decel, popin 80%
    animation = windowsIn, 1, 2, md3_decel, popin 80%
    animation = windowsOut, 1, 2, md3_accel, popin 80%

    # Static elements don't need high-duration animations
    animation = border, 1, 5, default
    animation = fade, 1, 2, md3_decel

    # Faster layer and workspace switching
    animation = layersIn, 1, 2, md3_decel, slide
    animation = layersOut, 1, 1.5, md3_accel
    animation = fadeLayersIn, 1, 1.5, md3_decel
    animation = fadeLayersOut, 1, 2, md3_accel

    # Dramatically faster workspace switching (7 -> 3)
    animation = workspaces, 1, 3, md3_decel, slide
    animation = specialWorkspace, 1, 2, md3_decel, slidevert
}
